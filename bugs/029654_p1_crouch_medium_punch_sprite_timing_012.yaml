fix_hints:
- Sprite channels concern the VISIBLE track, not the mechanics. The mechanical timing (ROM) is the ruler;
  the animation must be fitted to it, never the other way around.
- 'State -> animation mapping: characters/akuma.py (_STATE_ANIM and the state-transition handler around
  it).'
- 'Animation definitions (sprite lists + frame_duration): src/street_fighter_3rd/data/animations.yaml.
  An attack animation''s game-frame length (n_sprites x frame_duration, or per-cel durations) should equal
  the move''s ROM total so cels neither cut off nor freeze on the last pose mid-move.'
- 'Playback engine: src/street_fighter_3rd/systems/animation.py (Animation/FolderAnimation.update, AnimationController).'
- "Use the ticket's repro.cel_timeline: it aligns cel changes against the measured phase per frame \u2014\
  \ the desync is visible as rows where the cel is wrong for the phase."
- 'sprite_fallback means a placeholder rectangle was drawn: sprites are not bundled (Capcom copyright);
  local assets come from the tools/sprite_extraction personal-use path. Missing files, not code, unless
  the path/mapping is wrong.'
- animation finished and held its last cel while the move was still running
resolution: "cr.MP played 7 cels x 2 = 14 frames vs the 22-frame ROM total; per-cel holds now sum to 22\
  \ (Akuma._setup_animations ROM-fit). The observed '5' was the hitstop-racing artifact: animations advanced\
  \ during hit freeze while mechanics paused \u2014 they are now frozen in lockstep (akuma.py update)."
