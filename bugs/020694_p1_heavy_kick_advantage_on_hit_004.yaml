fix_hints:
- Frame advantage is EMERGENT (defender_free_frame - attacker_free_frame); there is no single advantage
  field to edit.
- If measured advantage != community expectation, first check the hitstun/blockstun applied (combat tier),
  then the attacker's recovery (timing tier). Fix the inputs, never fudge the output.
resolution: 'Three-part fix. (1) s.HK is a two-hit move (active 6-8 and 16-20 inside a 39-frame ROM total);
  the Frame Lab now measures the 7 boxes-off frames between the windows as GAP, not recovery, and diffs
  total against the ROM total (core/frame_lab.py). (2) hitstun/blockstun are now back-solved from community
  on_hit/on_block against the ROM timeline (akuma_hitboxes._calibrated_stun): HK hitstun 20->23. (3) advantage
  is only diffed when the FINAL active window connects (community advantage assumes a full connect). Measured
  advantage is -1 == community when the second kick lands. Pinned by tests/test_advantage_calibration.py.'
