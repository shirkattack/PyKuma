- Frame advantage is EMERGENT (defender_free_frame - attacker_free_frame); there is no single advantage
  field to edit.
- If measured advantage != community expectation, first check the hitstun/blockstun applied (combat tier),
  then the attacker's recovery (timing tier). Fix the inputs, never fudge the output.
resolution: 'Declared hitstun was miscalibrated: 16 hitstun with a 23-frame total and hit on frame 5 can
  only ever yield -3. hitstun/blockstun are now derived from community on_hit/on_block against the ROM
  timeline (akuma_hitboxes._calibrated_stun): MK hitstun 16->20, blockstun 13->18; the adapter now applies
  declared blockstun instead of max(4,hitstun//2). Emergent advantage measures +1 == community. Pinned
  by tests/test_advantage_calibration.py.'
