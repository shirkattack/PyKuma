# Animation configuration for Street Fighter 3rd Strike characters
# (sprite sequences, frame durations, offsets)
#
# NOTE (data harmony): this file is PRESENTATION-ONLY — sprite lists, frame
# durations, offsets, loop flags. It is NOT a source of frame data or hitboxes:
# the ROM-verified repository (data/characters/akuma/hitboxes.yaml via
# hitbox_repository) is canonical for timing and geometry (see ARCHITECTURE.md).
# Legacy embedded frame_data:/hitbox: blocks were removed after verifying no
# live code reads them; tools/framelab/audit_animations.py flags any that
# reappear as data_drift.

characters:
  akuma:
    # Character-specific rendering settings
    sprite_scale: 2.0
    ground_offset: 190  # Pixels below character.y where sprite bottom is positioned

    animations:
      # === IDLE/MOVEMENT ===

      stance:
        # Standing idle animation
        source: numbered_sprites
        sprites: [18273, 18274, 18275, 18276, 18277, 18278, 18279, 18280, 18281, 18282]
        frame_duration: 8  # Hold each frame for 8 game frames (subtle breathing)
        loop: true

      walk_forward:
        # Walking forward animation
        source: numbered_sprites
        sprites: [18283, 18284, 18285, 18288, 18289, 18290, 18291, 18292, 18293]
        frame_duration: 3  # Hold each frame for 3 game frames (smooth walk)
        loop: true

      crouch_hold:
        # Crouching hold pose (single frame, loops)
        source: numbered_sprites
        sprites: [18439]  # Fully crouched pose
        frame_duration: 1
        loop: true

      # === ATTACKS ===

      medium_punch:
        # Standing Medium Punch (s.MP)
        source: numbered_sprites
        sprites: [18673, 18673, 18673, 18674, 18674, 18675, 18676, 18677, 18678, 18679, 18680, 18681, 18682, 18682, 18682, 18682, 18682, 18682, 18673, 18673, 18673, 18673]
        frame_duration: 1  # Each sprite displays for 1 game frame
        loop: false
      crouch_light_punch:
        # Crouching Light Punch (cr.LP)
        source: folder
        path: "tools/sprite_extraction/akuma_animations/akuma-crouch-wp"
        frames: 7       # Number of frames in folder (frame_000.png to frame_006.png)
        frame_duration: 2  # Hold each frame for 2 game frames
        loop: false
      light_punch:
        # Standing Light Punch (s.LP)
        source: numbered_sprites
        sprites: [18664, 18666, 18667, 18669, 18670, 18669, 18671, 18671, 18671, 18672, 18672, 18672, 18664, 18664]
        frame_duration: 1
        loop: false
      heavy_punch:
        # Standing Heavy Punch (s.HP) - Akuma's signature uppercut
        source: numbered_sprites
        sprites: [18640, 18640, 18640, 18641, 18641, 18642, 18643, 18643, 18643, 18644, 18644, 18644, 18645, 18645, 18645, 18646, 18646, 18646, 18647, 18647, 18647, 18648, 18648, 18648, 18649, 18649, 18649, 18649, 18649, 18649, 18640, 18640, 18640, 18640, 18640, 18640, 18640, 18640]
        frame_duration: 1
        loop: false
      light_kick:
        # Standing Light Kick (s.LK)
        source: numbered_sprites
        sprites: [18706, 18706, 18706, 18707, 18708, 18709, 18710, 18711, 18711, 18711, 18712, 18712, 18712, 18712, 18712, 18706, 18706, 18706, 18706]
        frame_duration: 1
        loop: false
      medium_kick:
        # Standing Medium Kick (s.MK)
        source: numbered_sprites
        sprites: [18696, 18696, 18697, 18697, 18698, 18698, 18699, 18700, 18700, 18701, 18701, 18702, 18702, 18703, 18704, 18705, 18696, 18696, 18696, 18696, 18696, 18696, 18696]
        frame_duration: 1
        loop: false
      heavy_kick:
        # Standing Heavy Kick (s.HK)
        source: numbered_sprites
        sprites: [18717, 18717, 18717, 18717, 18717, 18717, 18718, 18718, 18718, 18718, 18720, 18720, 18720, 18720, 18720, 18720, 18721, 18721, 18721, 18721, 18722, 18722, 18722, 18722, 18722, 18722, 18722, 18722, 18722, 18722, 18722, 18717, 18717, 18717, 18717, 18717, 18717, 18717, 18717]
        frame_duration: 1
        loop: false
      # === CROUCHING ATTACKS ===

      crouch_medium_punch:
        # Crouching Medium Punch (cr.MP)
        source: folder
        path: "tools/sprite_extraction/akuma_animations/akuma-crouch-mp"
        frames: 7
        frame_duration: 2
        loop: false
      crouch_heavy_punch:
        # Crouching Heavy Punch (cr.HP)
        source: folder
        path: "tools/sprite_extraction/akuma_animations/akuma-crouch-hp"
        frames: 11
        frame_duration: 3
        loop: false
      crouch_light_kick:
        # Crouching Light Kick (cr.LK)
        source: folder
        path: "tools/sprite_extraction/akuma_animations/akuma-crouch-wk"
        frames: 7
        frame_duration: 2
        loop: false
      crouch_medium_kick:
        # Crouching Medium Kick (cr.MK)
        source: folder
        path: "tools/sprite_extraction/akuma_animations/akuma-crouch-mk"
        frames: 11
        frame_duration: 2
        loop: false
      crouch_heavy_kick:
        # Crouching Heavy Kick (cr.HK) - Sweep
        source: folder
        path: "tools/sprite_extraction/akuma_animations/akuma-crouch-hk"
        frames: 13
        frame_duration: 2
        loop: false
      # === SPECIAL MOVES ===

      gohadoken:
        # Gohadoken (QCF+P) - Fireball
        source: numbered_sprites
        sprites: [19024, 19024, 19025, 19025, 19026, 19027, 19028, 19029, 19030, 19031, 19032, 19033, 19034, 19035, 19036, 19037, 19038, 19039, 19040, 19041, 19042, 19043, 19044, 19045]
        frame_duration: 1
        loop: false
        projectile:
          spawn_frame: 14  # Frame to spawn projectile
          offset_x: 40     # Spawn position offset
          offset_y: -60    # Chest height
          speeds:          # Speed by strength
            light: 7.0
            medium: 9.0
            heavy: 11.0
